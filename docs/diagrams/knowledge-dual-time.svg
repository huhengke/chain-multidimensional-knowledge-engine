<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="590" viewBox="0 0 1220 590" role="img" aria-labelledby="title desc">
  <title id="title">知识脑双时间入口与候选交集</title><desc id="desc">昨天听说去年发生的事分别进入存入观察索引和内容时间星团，再在单元与来源引用上求交并校验证据。计数为示例。</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526d83"/></marker></defs>
  <rect width="1220" height="590" fill="#f8fbfd"/>
  <g font-family="Microsoft YaHei,Noto Sans SC,Arial,sans-serif" fill="#183349" text-anchor="middle">
    <rect x="270" y="20" width="680" height="64" rx="8" fill="#e8f2fc" stroke="#3979b4" stroke-width="2"/>
    <text x="610" y="47" font-size="20" font-weight="700">“我昨天听别人说，去年发生了什么？”</text><text x="610" y="70" font-size="13">同一问题含两个时间角色，自动识别，无需人工逐条填写</text>
    <g fill="none" stroke="#526d83" stroke-width="2" marker-end="url(#a)"><path d="M500 84V110H290V138"/><path d="M720 84V110H930V138"/></g>
    <rect x="70" y="143" width="440" height="185" rx="9" fill="#e6f6f2" stroke="#248e79" stroke-width="2"/>
    <rect x="710" y="143" width="440" height="185" rx="9" fill="#f0eafa" stroke="#8460af" stroke-width="2"/>
    <text x="290" y="173" font-size="19" font-weight="700">入口 A · 存入 / 观察时间</text><text x="290" y="201" font-size="14">昨天 → 中通时间日圈倒排</text><text x="290" y="228" font-size="14">ingested_at / observed_at</text><text x="290" y="258" font-size="14">来源与单元候选 · 例如 2 条</text><text x="290" y="287" font-size="12" fill="#52677a">“听到 / 看过”需真实观察记录</text><text x="290" y="309" font-size="12" fill="#52677a">仅有导入记录时只能说明存入，不能编造行为</text>
    <text x="930" y="173" font-size="19" font-weight="700">入口 B · 内容时间</text><text x="930" y="201" font-size="14">去年 → 知识时间维度星团</text><text x="930" y="228" font-size="14">内容区间 / 粒度 / 依据 / 参照日期</text><text x="930" y="258" font-size="14">内容时间候选 · 例如 100 条</text><text x="930" y="287" font-size="12" fill="#52677a">从元数据、标题、章节、正文自动抽取</text><text x="930" y="309" font-size="12" fill="#52677a">不以存入时间覆盖内容时间；候选不伪装精确日期</text>
    <g fill="none" stroke="#526d83" stroke-width="2" marker-end="url(#a)"><path d="M290 328V370H475V400"/><path d="M930 328V370H745V400"/></g>
    <rect x="384" y="405" width="452" height="74" rx="8" fill="#fff4dc" stroke="#bd8c2e" stroke-width="2"/>
    <text x="610" y="434" font-size="19" font-weight="700">先取较小集合，按单元 / 来源引用求交</text><text x="610" y="461" font-size="13">当前为内存倒排与集合运算；不是两次全库扫描或跨脑向量混合</text>
    <path d="M610 479V509" fill="none" stroke="#526d83" stroke-width="2" marker-end="url(#a)"/>
    <rect x="250" y="516" width="720" height="50" rx="8" fill="#ffffff" stroke="#7f9cb3" stroke-width="1.5"/>
    <text x="610" y="538" font-size="15" font-weight="700">公共候选 → 权限、发布、版本、原文核验 → 回答 / 无命中</text><text x="610" y="557" font-size="12" fill="#52677a">本图计数仅用于说明；时间星团独立于语义知识星团与记忆脑星团</text>
  </g>
</svg>
