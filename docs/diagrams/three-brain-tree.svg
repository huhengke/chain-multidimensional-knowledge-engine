<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="710" viewBox="0 0 1260 710" role="img" aria-labelledby="title desc">
  <title id="title">三脑智慧树：共同规范、独立基座与向上生长的日圈主干</title>
  <desc id="desc">三个独立智慧树分别拥有管状中通内链、周存、DNA 外链和侧枝，底部为共享规范，顶部返回统一结果。此图为结构示意，不是实际节点计数。</desc>
